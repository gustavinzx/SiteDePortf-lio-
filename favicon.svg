<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#371058"/>
  <!-- Camera body -->
  <rect x="18" y="32" width="64" height="42" rx="7" ry="7" fill="none" stroke="#ffb3c6" stroke-width="5"/>
  <!-- Lens outer -->
  <circle cx="50" cy="53" r="14" fill="none" stroke="#ffb3c6" stroke-width="4"/>
  <!-- Lens inner -->
  <circle cx="50" cy="53" r="6" fill="#ffb3c6"/>
  <!-- Flash bump -->
  <rect x="30" y="24" width="16" height="10" rx="3" ry="3" fill="#ffb3c6"/>
  <!-- Small flash dot -->
  <circle cx="74" cy="38" r="4" fill="#ffb3c6" opacity="0.6"/>
</svg>
